services:
  infinity:
    image: michaelf34/infinity:latest
    ports:
      - "7997:7997"
    volumes:
      - infinity-data:/app/.cache
    restart: unless-stopped
    command: v2 --model-id BAAI/bge-m3 --port 7997 --device cuda --dtype float16 --batch-size 128
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - INFINITY_QUEUE_BATCH_WAIT_MULTIPLIER=0.0
      - INFINITY_BATCH_SIZE=1

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    ports:
      - "8085:80"
    environment:
      - TZ=Asia/Tokyo
      # attachment-cache-dir を使うには base-url (外部から見えるこのサーバー自身の URL) の指定が必須
      - NTFY_BASE_URL=http://100.121.83.66:8085
      # 通知アイコン (X-Icon / favicon) を送るには attachment 機能を有効化する必要がある
      - NTFY_ATTACHMENT_CACHE_DIR=/var/cache/ntfy/attachments
      - NTFY_ATTACHMENT_TOTAL_SIZE_LIMIT=200M
      - NTFY_ATTACHMENT_FILE_SIZE_LIMIT=2M
    volumes:
      - ntfy-attachments:/var/cache/ntfy/attachments
    command: serve
    restart: unless-stopped

volumes:
  infinity-data:
  ntfy-attachments: